version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: waynder-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: waynder
      POSTGRES_PASSWORD: waynder_dev
      POSTGRES_DB: waynder_db
    ports:
      - "5432:5432"
    volumes:
      - waynder_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d   # runs .sql files on first create only

volumes:
  waynder_pgdata: