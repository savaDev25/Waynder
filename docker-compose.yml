services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: waynder-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: waynder
      POSTGRES_PASSWORD: waynder_dev
      POSTGRES_DB: waynder_db
    ports:
      - "55432:5432"   # host:container — 5433 avoids the native install on 5432
    volumes:
      - waynder_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d

volumes:
  waynder_pgdata: