name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
  pull_request:
    paths:
      - "backend/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/waynder

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: waynder
          POSTGRES_PASSWORD: waynder_dev
          POSTGRES_DB: waynder_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply schema to CI database
        working-directory: ${{ github.workspace }}/db/init
        run: |
          for f in *.sql; do
            PGPASSWORD=waynder_dev psql -h localhost -U waynder -d waynder_db -f "$f"
          done

      - name: Run tests
        env:
          INGEST_API_KEY: ci-test-key
        run: >
          mvn -B test
          -Dspring.datasource.url=jdbc:postgresql://localhost:5432/waynder_db
          -Dspring.datasource.username=waynder
          -Dspring.datasource.password=waynder_dev
          -Djwt.secret=ci-only-throwaway-secret-never-used-outside-this-workflow-32bytes+
          -Dcors.allowed-origins=http://localhost:3000
          -Drp.enable=false