name: Scraper CI

on:
  push:
    branches: [main]
    paths:
      - "scraper/**"
  pull_request:
    paths:
      - "scraper/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v